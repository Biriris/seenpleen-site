name: Process CMS images

on:
  push:
    branches:
      - main
    paths:
      - 'public/images/**'
      - 'src/data/projects.json'

permissions:
  contents: write

jobs:
  process-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect changed files
        run: |
          {
            echo 'CHANGED_FILES<<EOF'
            git diff --name-only HEAD~1 HEAD -- public/images src/data/projects.json
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Move new root uploads into project folders
        run: npm run organize-cms-uploads

      - name: Generate responsive AVIF and WebP images
        run: npm run optimize-images

      - name: Commit processed images
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No image changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images src/data/projects.json
          git commit -m "Process CMS image uploads" -m "Organize new root-level CMS image uploads into project folders and generate responsive AVIF/WebP derivatives."
          git push
